# ForgeOS — Alacritty (verde hacker, translúcida)
[window]
padding = { x = 8, y = 8 }
opacity = 0.80

[font]
normal = { family = "JetBrains Mono", style = "Regular" }
bold = { family = "JetBrains Mono", style = "Bold" }
size = 11.0

[colors.primary]
background = "#000000"
foreground = "#00ff41"

[colors.cursor]
text = "#000000"
cursor = "#00ff41"

[colors.normal]
black = "#000000"
red = "#ff5555"
green = "#00ff41"
yellow = "#ccff00"
blue = "#00aa55"
magenta = "#66ff99"
cyan = "#00ff99"
white = "#ccffcc"

[colors.bright]
black = "#1a5c2e"
red = "#ff7777"
green = "#33ff66"
yellow = "#e6ff66"
blue = "#33cc77"
magenta = "#99ffbb"
cyan = "#66ffcc"
white = "#eaffea"

[scrolling]
history = 10000
multiplier = 3

[selection]
save_to_clipboard = true
